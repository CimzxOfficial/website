<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd900">
  <title>Cimzx Official — Bio Link</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --yellow: #ffd900;
      --black: #080808;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.18) 0 1px, transparent 2px),
        radial-gradient(circle at 75% 35%, rgba(0,0,0,.08) 0 1px, transparent 2px),
        var(--yellow);
      background-size: 7px 7px, 9px 9px, auto;
      color: var(--black);
      padding: 34px 16px 45px;
    }

    .container {
      width: min(100%, 680px);
      margin: auto;
      text-align: center;
    }

    .profile {
      margin-bottom: 25px;
    }

    .avatar {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #080808;
      background: #fff;
      box-shadow: 6px 6px 0 #080808;
      display: block;
      margin: 0 auto 25px;
    }

    .avatar-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 900;
      background: #fff;
    }

    h1 {
      font-size: clamp(27px, 7vw, 39px);
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .verified {
      display: inline-flex;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #168cff;
      color: white;
      font-size: 14px;
      vertical-align: 5px;
      margin-left: 5px;
    }

    .bio {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 23px;
    }

    .socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-bottom: 34px;
    }

    .socials a {
      width: 45px;
      height: 45px;
      border: 3px solid #080808;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #080808;
      text-decoration: none;
      font-size: 19px;
      font-weight: 900;
      transition: .2s ease;
      background: rgba(255,255,255,.08);
    }

    .socials a:hover {
      transform: translateY(-5px) rotate(-4deg);
      box-shadow: 4px 4px 0 #080808;
      background: white;
    }

    .links {
      display: grid;
      gap: 24px;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 96px;
      padding: 20px 25px;
      border: 4px solid #080808;
      color: #080808;
      text-decoration: none;
      font-size: clamp(21px, 5vw, 30px);
      font-weight: 900;
      letter-spacing: -.6px;
      box-shadow: 9px 10px 0 #080808;
      transition: transform .18s ease, box-shadow .18s ease;
      overflow: hidden;
    }

    .link-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background:
        radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 2px),
        radial-gradient(circle at 70% 70%, #000 0 1px, transparent 2px);
      background-size: 6px 6px, 8px 8px;
    }

    .link-card:hover {
      transform: translate(4px, 5px);
      box-shadow: 4px 5px 0 #080808;
    }

    .link-card:active {
      transform: translate(8px, 9px);
      box-shadow: 1px 1px 0 #080808;
    }

    .whatsapp { background: #ff5964; }
    .telegram { background: #35c5e6; }
    .testimoni { background: #bd63ed; }

    .icon {
      margin-right: 9px;
      font-size: .9em;
    }

    .footer {
      margin-top: 32px;
      font-size: 13px;
      font-weight: 800;
      opacity: .75;
    }

    @media (max-width: 480px) {
      body {
        padding: 27px 13px 38px;
      }

      .avatar {
        width: 115px;
        height: 115px;
        margin-bottom: 20px;
      }

      .socials {
        gap: 14px;
      }

      .socials a {
        width: 41px;
        height: 41px;
        font-size: 17px;
      }

      .link-card {
        min-height: 84px;
        box-shadow: 8px 8px 0 #080808;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="profile">
      <!-- Ganti src dengan foto profil kamu, contoh:
           src="foto.jpg" -->
      <img class="avatar" src="profile.png" alt="https://files.catbox.moe/1kzgp6.png">

      <h1>
        Cimzx Official
        <span class="verified">✓</span>
      </h1>

      <p class="bio">Welcome to my bio link ⚡</p>

      <nav class="socials" aria-label="Social media">
        <a href="https://wa.me/62881010714328" target="_blank" rel="noopener" aria-label="WhatsApp">WA</a>
        <a href="https://t.me/CimzxOffc" target="_blank" rel="noopener" aria-label="Telegram">TG</a>
        <a href="https://whatsapp.com/channel/0029Vb6nuu37YScws95djh3u" target="_blank" rel="noopener" aria-label="Testimoni">✓</a>
      </nav>
    </section>

    <section class="links" aria-label="Bio links">
      <a class="link-card whatsapp"
         href="https://wa.me/62881010714328"
         target="_blank" rel="noopener">
        <span class="icon">💬</span> WhatsApp
      </a>

      <a class="link-card telegram"
         href="https://t.me/CimzxOffc"
         target="_blank" rel="noopener">
        <span class="icon">✈️</span> Telegram
      </a>

      <a class="link-card testimoni"
         href="https://whatsapp.com/channel/0029Vb6nuu37YScws95djh3u"
         target="_blank" rel="noopener">
        <span class="icon">⭐</span> Testimoni
      </a>
    </section>

    <footer class="footer">
      © 2026 Cimzx Official
    </footer>

  </main>
</body>
</html>
